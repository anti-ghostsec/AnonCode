name: release

# A v* tag builds the app for Linux and publishes it with the source it
# was built from, ready to start with ./anoncode.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported runner, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libgl-dev
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        working-directory: packages/anoncode
        run: cargo test --release --locked --no-default-features

      - name: Build
        working-directory: packages/anoncode
        run: cargo build --release --locked

      - name: Package
        run: |
          name="AnonCode-${GITHUB_REF_NAME}-linux-x86_64"
          git archive --format=tar --prefix="$name/" HEAD > "$name.tar"
          # Built after the source's time, so ./anoncode uses it as it is.
          mkdir -p "stage/$name/packages/anoncode/target/release"
          cp packages/anoncode/target/release/anoncode "stage/$name/packages/anoncode/target/release/"
          tar --append -f "$name.tar" -C stage "$name/packages/anoncode/target/release/anoncode"
          gzip -9 "$name.tar"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" AnonCode-*.tar.gz AnonCode-*.tar.gz.sha256 \
            --title "AnonCode $GITHUB_REF_NAME" --generate-notes
